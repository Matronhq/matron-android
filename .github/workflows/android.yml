name: Android CI

on:
  push:
    branches: [main]
  pull_request:

# Build and test only — nothing here writes back to the repo, so the
# GITHUB_TOKEN handed to the Gradle build needs no more than the checkout.
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew :app:assembleDebug

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Publish test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
