name: Release AAB

# Builds a signed Play Store App Bundle when a version tag is pushed
# (e.g. `git tag v0.1.0 && git push origin v0.1.0`), or on demand.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MATRON_UPLOAD_KEYSTORE_BASE64  base64 of matron-upload.jks
#                                  (macOS: base64 -i matron-upload.jks | pbcopy)
#   MATRON_UPLOAD_STORE_PASSWORD   keystore password
#   MATRON_UPLOAD_KEY_ALIAS        key alias (matron-upload)
#   MATRON_UPLOAD_KEY_PASSWORD     key password

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MATRON_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > matron-upload.jks

      - name: Build signed release bundle
        env:
          MATRON_UPLOAD_STORE_FILE: matron-upload.jks
          MATRON_UPLOAD_STORE_PASSWORD: ${{ secrets.MATRON_UPLOAD_STORE_PASSWORD }}
          MATRON_UPLOAD_KEY_ALIAS: ${{ secrets.MATRON_UPLOAD_KEY_ALIAS }}
          MATRON_UPLOAD_KEY_PASSWORD: ${{ secrets.MATRON_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:bundleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f matron-upload.jks

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
