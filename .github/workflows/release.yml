name: Release AAB

# Builds a signed Play Store App Bundle when a version tag is pushed
# (e.g. `git tag v0.1.0 && git push origin v0.1.0`), or on demand.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   MATRON_UPLOAD_KEYSTORE_BASE64  base64 of matron-upload.jks
#                                  (macOS: base64 -i matron-upload.jks | pbcopy)
#   MATRON_UPLOAD_STORE_PASSWORD   keystore password
#   MATRON_UPLOAD_KEY_ALIAS        key alias (matron-upload)
#   MATRON_UPLOAD_KEY_PASSWORD     key password
#
# Optional repository secrets for push notifications (Firebase Cloud
# Messaging). All four, from the Android app registered in the Firebase
# project (Project settings -> General -> Your apps). Unset: the bundle has
# push notifications switched off.
#   MATRON_FCM_PROJECT_ID          Firebase project id
#   MATRON_FCM_APP_ID              the Android app's id (1:<number>:android:<hex>)
#   MATRON_FCM_API_KEY             the Android app's web API key
#   MATRON_FCM_SENDER_ID           project number (sender id)
#
# Optional repository variable (Settings -> Secrets and variables -> Actions
# -> Variables):
#   MATRON_APP_LINK_HOST           journal host whose https://<host>/u/... tracker
#                                  links open in the app (App Links). Unset:
#                                  the bundle claims no links.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Despite the name, this job does not create a GitHub Release: it builds the
# bundle and hands it to actions/upload-artifact, which uses the Actions
# artifact API rather than the contents API. So read-only is correct here —
# if this ever grows a `gh release create` step it will need contents: write.
permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode upload keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MATRON_UPLOAD_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > matron-upload.jks

      - name: Build signed release bundle
        env:
          MATRON_UPLOAD_STORE_FILE: matron-upload.jks
          MATRON_UPLOAD_STORE_PASSWORD: ${{ secrets.MATRON_UPLOAD_STORE_PASSWORD }}
          MATRON_UPLOAD_KEY_ALIAS: ${{ secrets.MATRON_UPLOAD_KEY_ALIAS }}
          MATRON_UPLOAD_KEY_PASSWORD: ${{ secrets.MATRON_UPLOAD_KEY_PASSWORD }}
          MATRON_APP_LINK_HOST: ${{ vars.MATRON_APP_LINK_HOST }}
          MATRON_FCM_PROJECT_ID: ${{ secrets.MATRON_FCM_PROJECT_ID }}
          MATRON_FCM_APP_ID: ${{ secrets.MATRON_FCM_APP_ID }}
          MATRON_FCM_API_KEY: ${{ secrets.MATRON_FCM_API_KEY }}
          MATRON_FCM_SENDER_ID: ${{ secrets.MATRON_FCM_SENDER_ID }}
        run: |
          if [ -z "$MATRON_APP_LINK_HOST" ]; then
            echo "::warning::MATRON_APP_LINK_HOST is not set; this bundle claims no tracker links."
          fi
          if [ -z "$MATRON_FCM_PROJECT_ID$MATRON_FCM_APP_ID$MATRON_FCM_API_KEY$MATRON_FCM_SENDER_ID" ]; then
            echo "::warning::MATRON_FCM_* secrets are not set; this bundle has no push notifications."
          fi
          ./gradlew :app:bundleRelease

      - name: Remove decoded keystore
        if: always()
        run: rm -f matron-upload.jks

      # Gradle deliberately falls back to an unsigned bundle when the keystore
      # isn't usable (so local builds without secrets still work). In CI that
      # fallback is a trap — Play rejects unsigned bundles — so fail the run
      # instead of shipping an artifact that can't be uploaded.
      - name: Fail if bundle is unsigned
        run: |
          if ! unzip -l app/build/outputs/bundle/release/app-release.aab | grep -Eq 'META-INF/.*\.(RSA|DSA|EC)$'; then
            echo "::error::Bundle is unsigned — are the MATRON_UPLOAD_* secrets configured?"
            exit 1
          fi

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
